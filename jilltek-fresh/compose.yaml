services:
  postgres:
    image: timescale/timescaledb-ha:pg17
    container_name: jilltek-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jilltek}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_local_password}
      POSTGRES_DB: ${POSTGRES_DB:-jilltek}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/home/postgres/pgdata/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jilltek} -d ${POSTGRES_DB:-jilltek}"]
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    container_name: jilltek-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
volumes:
  postgres_data:
  redis_data:
